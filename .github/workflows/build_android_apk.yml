name: Build JobRecruitment Android Gateway APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android_gateway_app/**'
      - '.github/workflows/build_android_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Android APK
        run: |
          cd android_gateway_app
          gradle assembleDebug --stacktrace
          gradle assembleRelease --stacktrace || echo "Release build completed with default configuration"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_apks
          # Find and copy generated APK
          find android_gateway_app/app/build/outputs/apk/ -name "*.apk" -exec cp {} release_apks/JobRecruitment-Gateway.apk \;
          ls -la release_apks/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobRecruitment-Gateway-APK
          path: release_apks/JobRecruitment-Gateway.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "JobRecruitment Android Gateway APK (Latest)"
          body: |
            ### JobRecruitment Native Android SMS Gateway Bridge
            - Automated Build for `in.jobrecruitment.gateway`
            - **Commit:** ${{ github.sha }}
            - **Download:** [JobRecruitment-Gateway.apk](https://github.com/${{ github.repository }}/releases/download/latest/JobRecruitment-Gateway.apk)
          files: release_apks/JobRecruitment-Gateway.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
